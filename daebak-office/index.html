/* ===== 펜슬프리즘 추가 스타일 ===== */
.ie-toolbar button:disabled{color:#999}
.site-nav button.on{text-decoration:underline;text-underline-offset:3px}
.wordart{cursor:pointer}
.hp-title{margin:0 0 8px;padding:6px 10px;color:#fff;background:linear-gradient(90deg,#0b3d91,#2a7fd4);border:2px ridge #9cc7ff;font-size:14px}
.staff-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff-cards article{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;background:#fff;border:2px ridge #f9c;padding:8px}
.staff-cards article:nth-child(2){border-color:#9cf}
.staff-cards article:nth-child(3){border-color:#fc6}
.staff-cards article:nth-child(4){border-color:#9d9}
.staff-face{width:54px;height:54px;border:2px solid #333;border-radius:50%;background:#ffe0b8;display:grid;place-items:center;font-size:12px;line-height:1.1;text-align:center;white-space:pre}
.staff-cards b{display:block;color:#b00058;font-size:13px;margin-bottom:3px}
.staff-cards small{display:block;line-height:1.5;color:#333}
.staff-foot{margin-top:8px;padding:6px;background:#fff6a4;border:1px dashed #c90;text-align:center}
.board{width:100%;border-collapse:collapse;background:#fff}
.board th{background:#3a5fb0;color:#fff;padding:5px;border:1px solid #2a4a90}
.board td{border-bottom:1px dotted #999;padding:5px;text-align:center}
.board td.t{text-align:left}
.board tr.notice td{background:#fff4d6;font-weight:700}
.board button.link{background:0 0;border:0;padding:0;color:#1a3fa0;text-align:left;cursor:pointer}
.board button.link:hover{text-decoration:underline;color:#e00}
.board-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.post{background:#fff;border:2px solid #3a5fb0}
.post h3{margin:0;padding:7px 10px;background:#dfe8fb;border-bottom:1px solid #3a5fb0;font-size:13px}
.post .meta{padding:4px 10px;color:#555;border-bottom:1px dotted #999;font-size:11px}
.post .body{padding:12px;white-space:pre-wrap;line-height:1.7;min-height:90px}
.post .reply{margin:0 10px 10px;padding:8px 10px;background:#f2f7e8;border:1px dashed #6a9a3a;white-space:pre-wrap;line-height:1.6}
.post .reply b{color:#2d6a0a}
.post-foot{margin-top:8px;text-align:right}
.hp-guest.guest-app{height:auto;overflow:visible;background:transparent}
.hp-guest .guest-banner{padding:8px;font-size:15px}
.hp-guest .guest-list{margin:8px 0}
.hp-guest form{margin:8px 0;grid-template-columns:120px 1fr 72px}
.hp-map.map-canvas{margin-left:0;height:400px}
.guest-note{font-size:11px;color:#666;margin:4px 0 0;text-align:right}
/* 엑셀 탭 */
.sheet-tabs span{cursor:pointer}
.sheet-tabs span:first-child:not(.on){background:#eee}
.sheet-tabs span.on{background:#fff;font-weight:700}
.excel-app td.w{text-align:left}
/* 업무보고 */
.approval{position:absolute;top:24px;right:30px;border-collapse:collapse;font-size:11px}
.paper .approval th,.paper .approval td{border:1px solid #333;padding:2px 8px;text-align:center;background:#fff}
.paper .approval td{height:34px;width:48px;vertical-align:middle}
.approval .stamp{color:#d00;border:2px solid #d00;border-radius:50%;padding:2px 3px;font-size:10px;font-weight:700}
.report td.l{text-align:left}
/* 메모장 */
.notepad-app{overflow:auto}
/* 미니홈피 */
.mini-app{background:#8fb8d8;padding:10px;height:560px}
.mini-frame{background:#fff;border:3px solid #5d8fb8;border-radius:10px;display:grid;grid-template-columns:190px 1fr;gap:10px;padding:10px;height:100%}
.mini-left{border:1px dashed #9bb;border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px;background:#f6fbff}
.mini-count{font-size:10px;color:#888;text-align:center}
.mini-count b{color:#f60}
.mini-photo{height:120px;border:1px solid #bbb;background:linear-gradient(#e8f4ff,#cfe3f5);display:grid;place-items:center;white-space:pre;font-size:14px;line-height:1.2}
.mini-mood{font-size:11px;color:#555}
.mini-mood b{color:#f60}
.mini-intro{font-size:12px;line-height:1.6;color:#336}
.mini-bgm{margin-top:auto;font-size:10px;color:#fff;background:#5d8fb8;border-radius:4px;padding:4px 6px}
.mini-right{display:flex;flex-direction:column;min-height:0}
.mini-title{font-size:15px;font-weight:700;color:#3a6d96;border-bottom:2px solid #f90;padding-bottom:4px}
.mini-tabs{display:flex;gap:3px;margin:6px 0}
.mini-tabs button{border:1px solid #9bb;background:#eef6fc;border-radius:4px 4px 0 0;padding:3px 12px;font-size:11px;cursor:pointer}
.mini-tabs button.on{background:#f90;color:#fff;border-color:#f90;font-weight:700}
.mini-body{flex:1;overflow:auto;border-top:1px solid #9bb;padding-top:8px}
.mini-box{border:1px solid #d6e4ee;border-radius:4px;margin-bottom:8px}
.mini-box h4{margin:0;padding:4px 8px;background:#eef6fc;color:#3a6d96;font-size:12px}
.mini-box p{margin:0;padding:6px 8px;line-height:1.6;white-space:pre-wrap}
.mini-box ul{margin:0;padding:6px 8px 6px 22px;line-height:1.8}
.mini-box time{float:right;color:#999;font-size:10px;font-weight:400}
.mini-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-photos figure{margin:0;border:1px solid #ccc;padding:6px;background:#fff;text-align:center}
.mini-photos .pic{height:110px;display:grid;place-items:center;white-space:pre;font-size:13px;line-height:1.2;filter:blur(.6px)}
.mini-photos figcaption{font-size:11px;margin-top:4px;color:#555}
/* 간판 시안 */
.sign-canvas.map-canvas{overflow:auto;padding:12px;height:425px}
.sign{position:relative;margin:0 auto 22px;width:420px;padding:14px;text-align:center;font-weight:700}
.sign-1{background:#8b0000;color:#ffd700;border:6px double #ffd700;font:700 34px Batang,serif;letter-spacing:10px}
.sign-2{background:#111;color:#0ff;border:3px solid #f0f;font:700 24px Arial,sans-serif;text-shadow:0 0 6px #0ff,0 0 12px #f0f;letter-spacing:2px}
.sign-3{background:#222;color:#e11;border:5px solid #e11;font-size:30px;letter-spacing:4px}
.sign-no{position:absolute;left:-8px;top:-12px;background:#fff;color:#000;border:1px solid #000;font:11px Gulim;padding:1px 5px;letter-spacing:0;text-shadow:none}
.red-pen{position:absolute;right:-14px;bottom:-16px;color:#e00;font:700 13px Gulim;letter-spacing:0;text-shadow:none;transform:rotate(-4deg);background:#fff;padding:1px 5px;border:1px solid #e00}
.sign-result{margin:4px auto 0;width:420px;text-align:center;color:#00c;font-weight:700;border-top:2px dashed #999;padding-top:8px}
/* 네이트온 대화 */
.nate-app{background:#fff;height:400px;display:flex;flex-direction:column}
.nate-head{background:linear-gradient(#fff3d8,#ffd98a);border-bottom:1px solid #e0a020;padding:6px 8px;display:flex;align-items:center;gap:8px}
.nate-head span{font-size:24px}
.nate-head small{display:block;color:#888}
.nate-log{flex:1;overflow:auto;padding:8px;line-height:1.6}
.nate-log p{margin:0 0 4px}
.nate-log b{color:#1a55c0}
.nate-log b.boss{color:#c01a1a}
.nate-log .sys{color:#999;font-size:11px}
.nate-input{border-top:1px solid #ccc;padding:6px;display:flex;gap:4px}
.nate-input input{flex:1;border:2px inset #fff;background:#f4f4f4;padding:3px}
/* 지뢰찾기 */
.mine-app{background:silver;padding:6px;border:2px outset #fff}
.mine-top{display:flex;justify-content:space-between;align-items:center;border:2px inset #fff;padding:4px;margin-bottom:6px}
.mine-top output{background:#000;color:#f00;font:700 18px monospace;padding:0 4px;min-width:44px;text-align:right}
.mine-face{width:28px;height:28px;border:2px outset #fff;background:silver;font-size:15px;cursor:pointer;padding:0}
.mine-grid{display:grid;grid-template-columns:repeat(9,22px);border:3px inset #fff;width:max-content;margin:auto}
.mine-grid button{width:22px;height:22px;padding:0;border:2px outset #fff;background:silver;font:700 12px Arial;cursor:pointer}
.mine-grid button.open{border:1px solid #999;background:#d6d6d6;cursor:default}
.mine-grid button.boom{background:#f33}
.mine-msg{margin:6px 0 0;font-size:11px;text-align:center;min-height:30px;line-height:1.4}
.n1{color:#00f}.n2{color:#080}.n3{color:#f00}.n4{color:#008}.n5{color:#800}.n6{color:#088}.n7{color:#000}.n8{color:#666}
/* 운세 */
.fortune-app{background:#fff8e6;padding:14px;text-align:center;height:260px}
.fortune-app h3{margin:0 0 6px;color:#a0522d;font:700 18px Batang,serif}
.fortune-card{margin:10px auto;min-height:92px;border:3px double #a0522d;background:#fff;padding:10px;line-height:1.7;white-space:pre-wrap;display:grid;place-items:center}
/* 알림창 */
.alert-app{background:#ece9d8;padding:16px 14px 12px}
.alert-body{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.alert-icon{width:34px;height:34px;border-radius:50%;background:#1a5fd0;color:#fff;display:grid;place-items:center;font:700 20px Arial;border:2px solid #fff;box-shadow:0 0 0 1px #1a5fd0}
.alert-body p{margin:4px 0 0;white-space:pre-wrap;line-height:1.6}
.alert-foot{text-align:center;margin-top:14px}
.alert-foot button{min-width:76px}
.tray [data-open]{cursor:pointer}
.paper table.approval{position:absolute;top:22px;left:34px;width:auto;margin:0}
.paper .report th:nth-child(1){width:38px}
.paper .report th:nth-child(2){width:150px}
.paper .report th:nth-child(4){width:64px}
.paper .report th:nth-child(3){width:auto}
.board.price{margin-bottom:4px}
.board.price td:first-child{font-weight:700;width:55%}
.price-note{margin:0 0 12px;font-size:11px;color:#b00058;text-align:right}
.staff-cards article:nth-child(5){border-color:#c9f}
.staff-cards article:nth-child(6){border-color:#ccc}
.staff-cards article:nth-child(7){border-color:#f96}
/* ===== A컷/B컷 ===== */
.boss-col{display:flex;flex-direction:column;gap:3px}
.boss-pic{position:relative}
.boss-pic.bcut{filter:saturate(.8)}
.boss-pic.bc-glow .paint-face{background:#ffe6d6;box-shadow:0 0 12px 6px #fff}
.boss-pic.bc-glow .paint-hair{background:#5a4a40}
.cut-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.cut-nav.small{margin:0;gap:4px;font-size:10px}
.cut-nav.small button{padding:0 5px;font-size:10px;line-height:16px;cursor:pointer}
.cut-nav span{min-width:48px;text-align:center;font-weight:700}
.boss-note{font-size:10px;line-height:1.3;color:#b00058;text-align:center}
.cut-fx{position:absolute;left:0;right:0;top:6px;text-align:center;color:#e00;font:900 22px Arial,sans-serif;text-shadow:1px 1px 0 #fff;transform:rotate(-8deg);pointer-events:none}
.cut-fx.small{top:auto;bottom:18px;font-size:11px}
.photo-notice{margin:8px 0 0;font-size:10px;line-height:1.5;color:#666;text-align:left}
.photo-notice.wide{grid-column:1/-1;margin:2px 0 0;border-top:1px dotted #f99;padding-top:4px}
.photo-viewer.jh-viewer{height:auto;padding:10px 18px 14px}
.viewer-bar{display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px;padding:3px 6px;background:#fff;border:1px solid #aaa}

.junghyeok-drawing{position:relative}
.junghyeok-drawing.clean .jh-face span{display:none}
.junghyeok-drawing.sauce .jh-face span{width:26px;height:12px;border-radius:40%;right:18px;bottom:22px}
.junghyeok-drawing.eyes-dot .jh-face i{border:0;background:#222;width:10px;height:10px;border-radius:50%}
.junghyeok-drawing.eyes-shut .jh-face i{border-top:0;border-bottom:3px solid #222;border-radius:0 0 8px 8px;height:6px}
.jh-tear{display:none}
.junghyeok-drawing.eyes-tear .jh-tear{display:block;position:absolute;left:24px;top:52px;width:7px;height:16px;background:#6cb6ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:40px 0 0 #6cb6ff}
.junghyeok-drawing.blurry .jh-hair,.junghyeok-drawing.blurry .jh-face,.junghyeok-drawing.blurry .jh-shirt{filter:blur(2.5px);transform:translateX(8px)}
.junghyeok-drawing.tilt .jh-hair,.junghyeok-drawing.tilt .jh-face{transform:rotate(-14deg) translateX(-10px)}
.junghyeok-drawing.misbutton .jh-shirt{transform:skewY(7deg);text-align:left;padding-left:40px;box-sizing:border-box}
.photo-paper.bpaper{transform:rotate(1.5deg)}
.photo-stamp.bstamp{color:#555;border-color:#555}

.flyer-canvas{height:440px;padding:10px 14px;font-family:'Nanum Pen Script',Gulim,cursive}
.flyer-head{margin:0 0 12px;text-align:center;font:700 14px Gulim,sans-serif;color:#333}
.flyer-row{display:flex;gap:24px;justify-content:center;margin-bottom:26px}
.flyer{position:relative;background:#fff;border:1px solid #ccc;box-shadow:2px 3px 6px rgba(0,0,0,.25);padding:22px 12px 14px;text-align:center;font-family:'Nanum Pen Script',cursive;line-height:1.15}
.flyer::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:14px;margin-left:-14px;background:#1d8a5a;opacity:.85;transform:rotate(-6deg)}
.flyer b{display:block;font-size:34px;font-weight:400}
.flyer i{display:block;font-style:normal;font-size:20px}
.flyer em{display:block;font-style:normal;font-size:20px;margin-top:6px}

.flyer.f1{width:210px;transform:rotate(-2deg)}
.flyer.f2{width:240px;transform:rotate(1.5deg)}
.flyer.f2 .q{display:block;color:#d0306a;font-size:18px}
.flyer.f2 b{color:#1c4fd6;font-size:38px}
.flyer.f2 ul{margin:4px 0;padding:0;list-style:none;font-size:19px;color:#2a8a2a}

.flyer.f2 strong{color:#e0182d;font-size:26px}
.flyer.f3{width:470px;margin:0 auto 24px;padding-bottom:0;transform:rotate(-.8deg)}
.flyer.f3 b{display:inline;font-size:28px}
.flyer.f3 i{display:inline;font-size:18px}
.squid{display:flex;justify-content:center;gap:0;margin-top:8px;border-top:1px dashed #999}
.squid span{writing-mode:vertical-rl;font-size:15px;padding:6px 3px;border-left:1px dashed #bbb;height:112px}

.flyer .red-pen{font-family:Gulim,sans-serif;font-size:11px;line-height:1.35;right:-10px;bottom:-14px;text-align:left}
.flyer .red-pen.pen-top{top:-12px;bottom:auto;right:-16px;transform:rotate(5deg)}
.flyer .sign-no{font-family:Gulim,sans-serif}
.flyer-canvas .sign-result{width:auto;font-family:Gulim,sans-serif;font-size:12px;line-height:1.6}

  /* ================= 지뢰찾기 ================= */
  var M = { rows: 9, cols: 9, mines: 10 };
  function mineReset() {
    M.cells = [];
    for (var i = 0; i < M.rows * M.cols; i++) M.cells.push({ mine: false, open: false, flag: false, n: 0 });
    M.started = false; M.over = false; M.won = false; M.time = 0; M.boom = -1;
    renderMine();
  }
  function neighbors(i) {
    var r = Math.floor(i / M.cols), c = i % M.cols, out = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < M.rows && cc >= 0 && cc < M.cols) out.push(rr * M.cols + cc);
    }
    return out;
  }
  function placeMines(safe) {
    var banned = neighbors(safe).concat([safe]);
    var placed = 0;
    while (placed < M.mines) {
      var k = Math.floor(Math.random() * M.cells.length);
      if (M.cells[k].mine || banned.indexOf(k) >= 0) continue;
      M.cells[k].mine = true; placed++;
    }
    M.cells.forEach(function (c, i) {
      c.n = neighbors(i).filter(function (j) { return M.cells[j].mine; }).length;
    });
  }
  function mineOpen(i) {
    if (M.over) return;
    var c = M.cells[i];
    if (c.open || c.flag) return;
    if (!M.started) { placeMines(i); M.started = true; }
    if (c.mine) {
      M.over = true; M.boom = i;
      M.cells.forEach(function (x) { if (x.mine) x.open = true; });
      renderMine();
      return;
    }
    var stack = [i];
    while (stack.length) {
      var k = stack.pop(), cell = M.cells[k];
      if (cell.open || cell.flag) continue;
      cell.open = true;
      if (cell.n === 0) neighbors(k).forEach(function (j) { if (!M.cells[j].open) stack.push(j); });
    }
    var closed = M.cells.filter(function (x) { return !x.open; }).length;
    if (closed === M.mines) { M.over = true; M.won = true; }
    renderMine();
  }
  function mineFlag(i) {
    if (M.over) return;
    var c = M.cells[i];
    if (c.open) return;
    c.flag = !c.flag;
    renderMine();
  }
  function pad3(n) { return String(Math.max(-99, Math.min(999, n))).padStart(3, "0"); }
  function renderMine() {
    var el = winEls.mine;
    if (!el || !M.cells) return;
    var q = function (k) { return el.querySelector('[data-m="' + k + '"]'); };
    var flags = M.cells.filter(function (c) { return c.flag; }).length;
    q("left").textContent = pad3(M.mines - flags);
    q("time").textContent = pad3(M.time);
    q("face").textContent = M.won ? "★" : M.over ? "✖" : "☺";
    q("grid").innerHTML = M.cells.map(function (c, i) {
      var cls = "", txt = "";
      if (c.open) {
        cls = "open" + (i === M.boom ? " boom" : "");
        if (c.mine) txt = "✹";

  /* ================= 방명록 (이 컴퓨터에만 저장) ================= */
  var STORE_KEY = "daebak-office-guestbook-v1";

  var G = { page: null, loading: false, posting: false, status: "", admin: false };
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var d = raw ? JSON.parse(raw) : null;
      if (d && Array.isArray(d.mine) && Array.isArray(d.hidden)) return d;

  function saveStore(d) {

  function lastPage(total) { return Math.max(1, Math.ceil(total / PER_PAGE)); }
  function pageList(cur, last) {
    var set = {}; set[1] = 1; set[last] = 1;
    for (var s = cur - 2; s <= cur + 2; s++) if (s >= 1 && s <= last) set[s] = 1;
    var nums = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
    var out = [];
    nums.forEach(function (n, i) {
      if (i > 0 && n - nums[i - 1] > 1) out.push("gap");
      out.push(n);
    });
    return out;
  }
  function fmtDate(v) {

  // 관리자 모드: Shift+S → A → M (각 3초 이내)
  var seq = { step: 0, lastAt: 0 };
  window.addEventListener("keydown", function (e) {
    if (e.repeat || ["Shift", "Control", "Alt", "Meta"].indexOf(e.key) >= 0) return;
    var now = Date.now();
    if (now - seq.lastAt > 3000) seq.step = 0;
    var code = e.code || "Key" + String(e.key).toUpperCase();
    if (code === "KeyS" && e.shiftKey) {
      e.preventDefault(); seq = { step: 1, lastAt: now };
    } else if (seq.step === 1 && code === "KeyA") {
      e.preventDefault(); seq = { step: 2, lastAt: now };
    } else if (seq.step === 2 && code === "KeyM") {
      e.preventDefault(); seq = { step: 0, lastAt: 0 };
      G.admin = true;
      G.status = "관리자 모드 활성화!! × 버튼으로 글을 지울 수 있습니다.";
      renderGuest();
    } else {
      seq = { step: 0, lastAt: 0 };
    }
  });

  // 시계 : 보는 사람의 컴퓨터 시간대와 상관없이 한국(서울) 시간으로 표시
  function seoulNow() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Seoul", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date());
      var h = 0, m = 0;
      parts.forEach(function (x) { if (x.type === "hour") h = Number(x.value); if (x.type === "minute") m = Number(x.value); });
      return { h: h % 24, m: m };
    } catch (e) {
      var d = new Date(Date.now() + 9 * 3600000);
      return { h: d.getUTCHours(), m: d.getUTCMinutes() };
    }
  }
  function tick() {
    var t = seoulNow(), h = t.h;
    S.clock = (h < 12 ? "오전" : "오후") + " " + String(h % 12 || 12).padStart(2, "0") + ":" + String(t.m).padStart(2, "0");
    if (desktop) desktop.querySelector(".tray time").textContent = S.clock;
  }

  /* ================= 방문자 수 (GoatCounter) ================= */
  // 전체 방문자 = GoatCounter 누적 방문 수 + 1487 (진혁이가 정한 시작 숫자)
  var COUNT_BASE = 1487;
  var COUNT_URL = "https://pencilprism.goatcounter.com/counter/TOTAL.json";
  var visitTotal = COUNT_BASE;
  function showTotal() {
    var el = winEls.home && winEls.home.querySelector('[data-h="total"]');
    if (el) el.textContent = String(visitTotal).padStart(6, "0");
  }
  function loadTotal() {
    if (!window.fetch) return;
    var done = false;
    var timer = setTimeout(function () { done = true; }, 2000);
    fetch(COUNT_URL).then(function (r) { return r.json(); }).then(function (d) {
      if (done) return;
      clearTimeout(timer);
      var n = parseInt(String(d && d.count || "").replace(/[^0-9]/g, ""), 10);
      if (!isNaN(n)) { visitTotal = COUNT_BASE + n; showTotal(); }
    }).catch(function () {});
  }
  loadTotal();
